name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    env:
      # Placeholders so builds that read public config don't fail; no secrets are needed.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      WXT_API_URL: http://localhost:8000
      WXT_WEB_URL: http://localhost:3000
      WXT_SUPABASE_URL: https://example.supabase.co
      WXT_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: llm/uv.lock

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --group dev --frozen
        working-directory: llm

      - name: Lint, type-check, test and build
        run: pnpm turbo run lint typecheck test build
