[project]
name = "ansly-llm"
version = "1.0.0"
description = "Ansly answer engine: question analysis, profile retrieval, and grounded answer generation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "langchain-openai>=1.6.2",
    "langchain-core>=1.6.2",
    "httpx>=0.27.0",
    "anthropic>=1.11.0",
    "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
# Tests for the removed starter chat/RAG code; delete them together with src/app/{rag,intent,services}.
addopts = "--ignore=tests/test_rag.py --ignore=tests/test_intent_detector.py"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["knowledge"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is left to the formatter
